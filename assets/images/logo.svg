<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Primary Emerald-Teal to Deep Cyan Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Radiant Life Pulse Crimson Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Base with Specular Edge -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#shieldGrad)" filter="url(#glowShadow)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Subtle Internal Radial Highlight -->
  <circle cx="20" cy="18" r="16" fill="white" opacity="0.08" />

  <!-- Stylized Life Cross Nodes -->
  <path d="M32 14 C30.3 14 29 15.3 29 17 L29 25 L21 25 C19.3 25 18 26.3 18 28 C18 29.7 19.3 31 21 31 L29 31 L29 39 C29 40.7 30.3 42 32 42 C33.7 42 35 40.7 35 39 L35 31 L43 31 C44.7 31 46 29.7 46 28 C46 26.3 44.7 25 43 25 L35 25 L35 17 C35 15.3 33.7 14 32 14 Z" fill="#ffffff" opacity="0.95" />

  <!-- Life-Giving Heart at Center with Radiant Crimson Pulse -->
  <path d="M32 23 C29.8 20.2 26 21.2 26 24 C26 26.8 32 31.5 32 31.5 C32 31.5 38 26.8 38 24 C38 21.2 34.2 20.2 32 23 Z" fill="url(#pulseGrad)" />
  
  <!-- Dynamic EKG Pulse Wave across bottom -->
  <path d="M14 47 L23 47 L26 43 L29 51 L33 41 L36 49 L39 47 L50 47" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
